<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  /* Cyberpunk is a dark aesthetic — this theme commits to it. */
  :root {
    --page:      #07070f;
    --surface:   rgba(14, 16, 30, 0.82);
    --ink:       #e8f0ff;
    --ink-2:     #9aa5c4;
    --muted:     #5f6a8a;
    --hairline:  rgba(0, 229, 255, 0.14);
    --grid:      rgba(0, 229, 255, 0.09);
    --cyan:      #00e5ff;
    --magenta:   #ff2ec4;
    --violet:    #8b5cf6;
    --ok:        #0aff9d;
    --warn:      #fcee0a;
    --fail:      #ff3860;
    --info:      #00e5ff;
    --ok-wash:   rgba(10, 255, 157, 0.07);
    --warn-wash: rgba(252, 238, 10, 0.07);
    --fail-wash: rgba(255, 56, 96, 0.09);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Three.js layer + horizon glow behind everything */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: .8; }
  .horizon {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 45% at 50% -10%, rgba(139, 92, 246, 0.16), transparent 70%),
      radial-gradient(45% 35% at 85% 110%, rgba(255, 46, 196, 0.10), transparent 70%),
      radial-gradient(45% 35% at 10% 110%, rgba(0, 229, 255, 0.08), transparent 70%);
  }
  /* CRT scanlines, barely-there */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px);
  }
  .wrap { position: relative; z-index: 1; max-width: 1060px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ── Header ─────────────────────────────────────────── */
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 4px 0 18px; }
  .brand { display: flex; align-items: baseline; gap: 12px; margin-right: auto; }
  .brand h1 {
    font: 700 19px var(--mono); letter-spacing: 0.06em; margin: 0; white-space: nowrap;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(0, 229, 255, 0.35));
  }
  .brand .tag { color: var(--muted); font-size: 13px; }
  @media (max-width: 560px) {
    .brand h1 { font-size: 15px; }
    .brand .tag { display: none; }
  }
  .speed-opt { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; user-select: none; }
  .speed-opt input { accent-color: var(--magenta); }
  button.run {
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    color: #05060c; border: 0; border-radius: 8px; padding: 9px 18px;
    font: 700 13px var(--mono); letter-spacing: 0.05em; text-transform: uppercase;
    cursor: pointer; transition: filter .15s, opacity .15s, box-shadow .15s;
    box-shadow: 0 0 18px rgba(0, 229, 255, 0.35);
  }
  button.run:hover:not(:disabled) { filter: brightness(1.15); box-shadow: 0 0 26px rgba(0, 229, 255, 0.55); }
  button.run:disabled { opacity: .55; cursor: default; box-shadow: none; }

  /* ── Tabs ───────────────────────────────────────────── */
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin-bottom: 20px; }
  nav button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--ink-2); font: 500 13px var(--mono); letter-spacing: 0.04em;
    padding: 8px 14px; cursor: pointer; margin-bottom: -1px;
  }
  nav button.active {
    color: var(--cyan); border-bottom-color: var(--cyan);
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
  }

  /* ── Progress bar ───────────────────────────────────── */
  .progress { height: 2px; border-radius: 1px; overflow: hidden; background: var(--grid); margin-bottom: 20px; visibility: hidden; }
  .progress.on { visibility: visible; }
  .progress i { display: block; height: 100%; width: 30%; border-radius: 1px;
                background: linear-gradient(90deg, var(--cyan), var(--magenta));
                box-shadow: 0 0 10px var(--cyan);
                animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }

  /* ── Verdict banner ─────────────────────────────────── */
  .verdict {
    display: none; gap: 12px; align-items: flex-start;
    background: var(--surface); border: 1px solid var(--hairline);
    border-left: 4px solid var(--muted); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 20px; backdrop-filter: blur(2px);
  }
  .verdict.show { display: flex; }
  .verdict.ok   { border-left-color: var(--ok);   box-shadow: 0 0 30px rgba(10, 255, 157, 0.15);  background: linear-gradient(var(--ok-wash), var(--ok-wash)), var(--surface); }
  .verdict.warn { border-left-color: var(--warn); box-shadow: 0 0 30px rgba(252, 238, 10, 0.12);  background: linear-gradient(var(--warn-wash), var(--warn-wash)), var(--surface); }
  .verdict.fail { border-left-color: var(--fail); box-shadow: 0 0 30px rgba(255, 56, 96, 0.20);   background: linear-gradient(var(--fail-wash), var(--fail-wash)), var(--surface); }
  .verdict .vicon { font-size: 18px; line-height: 1.3; }
  .verdict h2 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .verdict p  { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }

  /* ── Empty state ────────────────────────────────────── */
  .hero {
    text-align: center; padding: 70px 20px;
    border: 1px dashed rgba(0, 229, 255, 0.25); border-radius: 14px;
    color: var(--ink-2); background: rgba(7, 7, 15, 0.45); backdrop-filter: blur(2px);
  }
  .hero .big { font-size: 34px; filter: drop-shadow(0 0 16px rgba(0,229,255,.5)); }
  .hero h2 { color: var(--ink); font: 650 17px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; margin: 14px 0 6px; }
  .hero p { max-width: 46ch; margin: 0 auto 22px; font-size: 14px; }

  /* ── Result cards ───────────────────────────────────── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 12px; padding: 14px 16px 8px;
    box-shadow: 0 0 24px rgba(0, 229, 255, 0.05); backdrop-filter: blur(2px);
  }
  .card h3 {
    margin: 0 0 8px; font: 650 10px var(--mono);
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan);
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
  }
  .row { display: flex; gap: 9px; padding: 6px 0; border-top: 1px solid var(--grid); align-items: baseline; flex-wrap: wrap; }
  .row:first-of-type { border-top: 0; }
  .row .icon { font-size: 13px; width: 16px; flex: none; text-align: center; font-weight: 700; }
  .icon.ok   { color: var(--ok);   text-shadow: 0 0 8px rgba(10, 255, 157, 0.7); }
  .icon.warn { color: var(--warn); text-shadow: 0 0 8px rgba(252, 238, 10, 0.6); }
  .icon.fail { color: var(--fail); text-shadow: 0 0 8px rgba(255, 56, 96, 0.7); }
  .icon.info { color: var(--info); text-shadow: 0 0 8px rgba(0, 229, 255, 0.5); }
  .row .name { font-weight: 550; font-size: 14px; }
  .row .detail { color: var(--ink-2); font-size: 13px; }
  .row .advice {
    flex-basis: 100%; margin: 2px 0 4px 25px; font-size: 13px;
    color: var(--ink-2); background: var(--warn-wash);
    border: 1px solid rgba(252, 238, 10, 0.15);
    border-radius: 6px; padding: 6px 10px;
  }
  .row .advice::before { content: "→ "; color: var(--warn); font-weight: 700; }
  .foot { color: var(--muted); font: 12px var(--mono); margin-top: 18px; }
  .error-banner {
    display: none; background: var(--fail-wash); border: 1px solid var(--fail);
    color: var(--ink); border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; font-size: 14px;
    box-shadow: 0 0 24px rgba(255, 56, 96, 0.25);
  }

  /* ── Live monitor ───────────────────────────────────── */
  #monitor { display: none; }
  .mon-controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .mon-controls select {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--hairline); border-radius: 7px; padding: 7px 10px;
    font: 12px var(--mono);
  }
  .mon-avail { color: var(--ink-2); font: 12px var(--mono); margin-left: auto; }
  .mon-grid { display: grid; gap: 14px; }
  .mon-card {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 0 24px rgba(0, 229, 255, 0.05); backdrop-filter: blur(2px);
    display: grid; grid-template-columns: 150px 1fr; gap: 4px 18px; align-items: center;
  }
  .mon-card .mtitle { font: 650 10px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); text-shadow: 0 0 10px rgba(0,229,255,.4); grid-column: 1; }
  .mon-card .mval { font: 650 26px var(--mono); letter-spacing: -0.02em; grid-column: 1; color: var(--ink); text-shadow: 0 0 14px rgba(0, 229, 255, 0.35); }
  .mon-card .mval small { font-size: 13px; font-weight: 500; color: var(--muted); text-shadow: none; }
  .mon-card .mval.lost { color: var(--fail); font-size: 18px; text-shadow: 0 0 14px rgba(255, 56, 96, 0.6); }
  .mon-card .msub { grid-column: 1; color: var(--muted); font: 11px var(--mono); }
  .spark {
    grid-column: 2; grid-row: 1 / span 3;
    display: flex; align-items: flex-end; justify-content: flex-end;
    gap: 2px; height: 74px;
    border-bottom: 1px solid var(--hairline); overflow: hidden;
  }
  .spark i {
    flex: 1 0 3px; max-width: 7px; min-height: 2px;
    background: linear-gradient(180deg, var(--magenta), var(--cyan));
    border-radius: 2px 2px 0 0; box-shadow: 0 0 6px rgba(0, 229, 255, 0.35);
  }
  .spark i.lost { background: var(--fail); box-shadow: 0 0 8px rgba(255, 56, 96, 0.7); height: 100% !important; opacity: .9; }
  @media (max-width: 640px) {
    .mon-card { grid-template-columns: 1fr; }
    .spark { grid-column: 1; grid-row: auto; }
  }
</style>
</head>
<body>
<div class="horizon"></div>
<canvas id="fx"></canvas>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>▚ NETWORK MANAGER</h1>
      <span class="tag">Is something wrong with this Wi-Fi?</span>
    </div>
    <label class="speed-opt"><input type="checkbox" id="speedOpt"> Include speed test</label>
    <button class="run" id="runBtn" onclick="runCheck()">Run full check</button>
  </header>

  <nav>
    <button id="tabDiag" class="active" onclick="showTab('diag')">Diagnosis</button>
    <button id="tabMon" onclick="showTab('mon')">Live monitor</button>
  </nav>

  <div class="progress" id="progress"><i></i></div>

  <div id="diag">
    <div class="error-banner" id="errorBanner"></div>
    <div class="verdict" id="verdict">
      <span class="vicon" id="verdictIcon"></span>
      <div><h2 id="verdictHead"></h2><p id="verdictAction"></p></div>
    </div>
    <div class="hero" id="hero">
      <div class="big">🛜</div>
      <h2>Diagnose this network</h2>
      <p>Captive portal? Hijacked DNS? Blocked ports? Weak signal?
         One click answers what's happening — and what you can do about it.</p>
      <button class="run" onclick="runCheck()">Run full check</button>
    </div>
    <div class="grid" id="cards"></div>
    <div class="foot" id="foot"></div>
  </div>

  <div id="monitor">
    <div class="mon-controls">
      <button class="run" id="monBtn" onclick="toggleMonitor()">Start monitoring</button>
      <select id="monInterval">
        <option value="2000">Every 2 s</option>
        <option value="3000" selected>Every 3 s</option>
        <option value="5000">Every 5 s</option>
      </select>
      <span class="mon-avail" id="monAvail"></span>
    </div>
    <div class="mon-grid">
      <div class="mon-card" id="mc-gateway"><span class="mtitle">Gateway (router)</span><span class="mval">—</span><span class="msub"></span><div class="spark"></div></div>
      <div class="mon-card" id="mc-internet"><span class="mtitle">Internet (1.1.1.1)</span><span class="mval">—</span><span class="msub"></span><div class="spark"></div></div>
      <div class="mon-card" id="mc-dns"><span class="mtitle">DNS resolver</span><span class="mval">—</span><span class="msub"></span><div class="spark"></div></div>
    </div>
  </div>

</div>

<script>
"use strict";
const ICONS = { ok: "✓", warn: "⚠", fail: "✕", info: "ℹ" };
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fx(name) { window.netfx && window.netfx.setState(name); }
// The server rejects /api/ calls without this header (blocks other sites).
const api = (path, opts = {}) =>
  fetch(path, { ...opts, headers: { "X-Network-Manager": "1" } });

/* ── Diagnosis ──────────────────────────────────────────── */
let polling = false;

async function runCheck() {
  const speed = $("speedOpt").checked ? 1 : 0;
  await api(`/api/run?speed=${speed}`, { method: "POST" });
  if (!polling) poll();
}

async function poll() {
  polling = true;
  try {
    const state = await (await api("/api/state")).json();
    render(state);
    if (state.running) { setTimeout(poll, 450); return; }
  } catch (e) {
    $("errorBanner").style.display = "block";
    $("errorBanner").textContent = "Lost contact with the local server — is `python3 main.py gui` still running?";
  }
  polling = false;
}

function render(state) {
  $("runBtn").disabled = state.running;
  $("runBtn").textContent = state.running ? "Checking…"
    : (state.results.length ? "Run again" : "Run full check");
  $("progress").classList.toggle("on", state.running);
  $("hero").style.display = state.results.length ? "none" : "";

  $("errorBanner").style.display = state.error ? "block" : "none";
  if (state.error) $("errorBanner").textContent = "The check crashed: " + state.error;

  // Drive the background: running pulses violet; the verdict sets the mood.
  fx(state.running ? "running" : (state.verdict ? state.verdict.status : "idle"));

  // Verdict banner
  const v = state.verdict;
  const banner = $("verdict");
  banner.className = "verdict" + (v ? ` show ${v.status}` : "");
  if (v) {
    $("verdictIcon").textContent = ICONS[v.status] || "";
    $("verdictIcon").className = "vicon icon " + v.status;
    $("verdictHead").textContent = v.headline;
    $("verdictAction").textContent = v.action || "";
    $("verdictAction").style.display = v.action ? "" : "none";
  }

  // Cards, grouped by section in arrival order
  const sections = new Map();
  for (const r of state.results) {
    if (!sections.has(r.section)) sections.set(r.section, []);
    sections.get(r.section).push(r);
  }
  let html = "";
  for (const [section, rows] of sections) {
    html += `<div class="card"><h3>${esc(section || "Results")}</h3>`;
    for (const r of rows) {
      html += `<div class="row">
        <span class="icon ${r.status}" aria-label="${r.status}">${ICONS[r.status] || ""}</span>
        <span class="name">${esc(r.name)}</span>
        <span class="detail">${esc(r.detail)}</span>
        ${r.advice ? `<span class="advice">${esc(r.advice)}</span>` : ""}
      </div>`;
    }
    html += "</div>";
  }
  $("cards").innerHTML = html;

  $("foot").textContent = !state.running && state.elapsed != null
    ? `done in ${state.elapsed}s · ${new Date().toLocaleTimeString()}` : "";
}

/* ── Tabs ───────────────────────────────────────────────── */
function showTab(which) {
  const diag = which === "diag";
  $("diag").style.display = diag ? "" : "none";
  $("monitor").style.display = diag ? "none" : "block";
  $("tabDiag").classList.toggle("active", diag);
  $("tabMon").classList.toggle("active", !diag);
}

/* ── Live monitor ───────────────────────────────────────── */
const MAX_TICKS = 90;
let monRunning = false;
let monTimer = null;
const ticks = { gateway: [], internet: [], dns: [] };
let sampleCount = 0, lostInternet = 0;

function toggleMonitor() {
  monRunning = !monRunning;
  $("monBtn").textContent = monRunning ? "Stop" : "Start monitoring";
  if (monRunning) monTick(); else clearTimeout(monTimer);
}

async function monTick() {
  if (!monRunning) return;
  const started = Date.now();
  try {
    const p = await (await api("/api/probe")).json();
    sampleCount++;
    if (p.internet_ms == null) lostInternet++;
    fx(p.internet_ms == null ? "fail" : "idle");
    pushTick("gateway", p.gateway_ms);
    pushTick("internet", p.internet_ms);
    pushTick("dns", p.dns_ms);
    const avail = (100 * (1 - lostInternet / sampleCount)).toFixed(0);
    $("monAvail").textContent =
      `internet availability ${avail}% · ${sampleCount} samples` +
      (lostInternet ? ` · ${lostInternet} lost` : "");
  } catch (e) { /* server briefly busy — skip this tick */ }
  const interval = +$("monInterval").value;
  monTimer = setTimeout(monTick, Math.max(250, interval - (Date.now() - started)));
}

function pushTick(name, ms) {
  const arr = ticks[name];
  arr.push(ms);
  if (arr.length > MAX_TICKS) arr.shift();

  const card = $("mc-" + name);
  const val = card.querySelector(".mval");
  const sub = card.querySelector(".msub");
  if (ms == null) {
    val.textContent = "✕ lost";
    val.className = "mval lost";
  } else {
    val.innerHTML = `${ms.toFixed(0)}<small> ms</small>`;
    val.className = "mval";
  }
  const seen = arr.filter((x) => x != null);
  if (seen.length) {
    sub.textContent = `min ${Math.min(...seen).toFixed(0)} · max ${Math.max(...seen).toFixed(0)} ms`;
  }

  // Scale each row to its own max (floored at 100 ms) so a 5 ms gateway
  // is still visible while a 300 ms spike doesn't clip.
  const scale = Math.max(100, ...seen);
  const spark = card.querySelector(".spark");
  spark.innerHTML = arr.map((x) => {
    if (x == null) return `<i class="lost" title="lost"></i>`;
    const h = Math.max(4, Math.min(100, (x / scale) * 100));
    return `<i style="height:${h}%" title="${x.toFixed(0)} ms"></i>`;
  }).join("");
}

/* On load: a run may already be in progress or finished. */
poll();
</script>
<script type="module" src="/fx.js"></script>
</body>
</html>
